[package]
name = "hackrf-proxyd"
version = "0.1.1"
edition = "2021"
description = "Network-attached HackRF OOK transceiver daemon with a WebSocket API, built for Home Assistant"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aetf/hackrf-proxy"
homepage = "https://github.com/Aetf/hackrf-proxy"
readme = "README.md"
keywords = ["hackrf", "sdr", "home-assistant", "ook", "websocket"]
categories = ["command-line-utilities", "hardware-support", "network-programming"]

[[bin]]
name = "hrf"
path = "src/main.rs"

[dependencies]
seify-hackrfone = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
# Used directly only to watch for hotplug; every transfer goes through
# seify-hackrfone, which depends on nusb ^0.1.11. The two must resolve to a
# single version, so this tracks the driver rather than the newest release.
nusb = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
