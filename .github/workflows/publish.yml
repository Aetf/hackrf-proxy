name: Release-plz

permissions:
  pull-requests: write
  contents: write
  # crates.io trusted publishing: release-plz exchanges the OIDC token itself.
  id-token: write

on:
  push:
    branches: [main]

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-24.04
    steps:
      # A GitHub App token rather than GITHUB_TOKEN, so the release PR and the
      # tag release-plz pushes can trigger workflows (CI on the PR, and
      # release-artifacts.yml on the tag).
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # Full history: release-plz reads it to build the changelog.
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          manifest_path: proxyd/Cargo.toml
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
